# Build and publish delta-forge-benchmarks to Docker Hub.
#
# Trigger: push of a `v*.*.*` tag on this repo, OR manual workflow_dispatch.
#
# Engine binary acquisition (context-aware, automated):
#
#   - delta-forge-cli + delta-forge-worker:
#       Downloaded from the deltaforge-org public release at the engine
#       version pinned by `df_version` (defaults to the bench tag minus the
#       leading "v"). The Dockerfile GPG-verifies each tarball against the
#       bundled public key.
#
#   - delta-forge-server (control plane):
#       Not yet released by deltaforge-org (release components are
#       cli, mcp, compute; no `server`). This workflow source-builds that
#       one binary from the engine repo at the same tag and stages it under
#       ./build/df-bins/ so the Dockerfile can COPY it in.
#
#       When the engine's build-release.sh adds `server` to DEFAULT_COMPONENTS,
#       drop the `source-build-server` job below; the Dockerfile will then
#       download all three binaries the same way.

name: docker-publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      df_version:
        description: "Engine release to bind to (bare version, e.g. 0.5.2). Default: bench tag minus 'v'."
        default: ""
      image_tag:
        description: "Docker tag to publish. Default: bench tag (e.g. v0.1.0)."
        default: ""

env:
  IMAGE_NAME: deltaforge/benchmarks
  ENGINE_REPO: deltaforge-org/delta-forge
  PLATFORMS: linux/amd64
  # Where Dockerfile expects the GPG public key. The workflow downloads it
  # from the engine release page on every run so it stays fresh.
  GPG_PUBKEY_PATH: docker/deltaforge-release-key.asc

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      # ---------- 1. Checkout + resolve versions ------------------------------
      - name: Checkout bench repo
        uses: actions/checkout@v4

      - name: Resolve versions
        id: ver
        run: |
          set -euo pipefail
          # Bench tag (drives the Docker image tag).
          if [ -n "${{ inputs.image_tag }}" ]; then
            BENCH_TAG="${{ inputs.image_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BENCH_TAG="${GITHUB_REF#refs/tags/}"
          else
            BENCH_TAG="ci-${GITHUB_SHA::7}"
          fi
          # Engine version. workflow_dispatch.df_version takes precedence;
          # otherwise default to the bench tag with the leading "v" stripped.
          if [ -n "${{ inputs.df_version }}" ]; then
            DF_VERSION="${{ inputs.df_version }}"
          elif [[ "$BENCH_TAG" == v* ]]; then
            DF_VERSION="${BENCH_TAG#v}"
          else
            echo "::error::Cannot infer engine version from non-vX.Y.Z bench tag '$BENCH_TAG'; pass df_version on workflow_dispatch."
            exit 1
          fi
          echo "bench_tag=$BENCH_TAG"  >> $GITHUB_OUTPUT
          echo "df_version=$DF_VERSION" >> $GITHUB_OUTPUT

      # ---------- 2. Fetch DeltaForge release public key ----------------------
      # The Dockerfile GPG-verifies the released tarballs against this key.
      # We fetch it from the deltaforge-org release page (which is signed by
      # the same key) and assert the fingerprint stored as a repo secret.
      - name: Download DeltaForge release public key
        env:
          EXPECTED_FP: ${{ secrets.DELTAFORGE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p docker
          # Convention: the engine release ships its own pubkey alongside
          # tarballs. Fall back to a repo-vendored copy if not.
          URL="https://github.com/${ENGINE_REPO}/releases/download/v${{ steps.ver.outputs.df_version }}/deltaforge-release-key.asc"
          if curl -fsSL --retry 3 "$URL" -o "${GPG_PUBKEY_PATH}"; then
            echo "Fetched release pubkey from $URL"
          elif [ -f "${GPG_PUBKEY_PATH}" ]; then
            echo "Using vendored ${GPG_PUBKEY_PATH}"
          else
            echo "::error::No release pubkey found at $URL or in repo"
            exit 1
          fi
          if [ -n "$EXPECTED_FP" ]; then
            FP=$(gpg --show-keys --with-colons "${GPG_PUBKEY_PATH}" \
                  | awk -F: '/^fpr:/ {print $10; exit}')
            if [ "$FP" != "$EXPECTED_FP" ]; then
              echo "::error::pubkey fingerprint mismatch: got $FP, expected $EXPECTED_FP"
              exit 1
            fi
            echo "pubkey fingerprint OK: $FP"
          fi

      # ---------- 3. Source-build delta-forge-server --------------------------
      # The one binary the public release does not yet ship. Pinned to the
      # same engine tag as the downloaded cli + worker, so the bench image
      # is internally consistent.
      - name: Checkout engine at v${{ steps.ver.outputs.df_version }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: v${{ steps.ver.outputs.df_version }}
          path: .engine-src
          token: ${{ secrets.GH_ENGINE_TOKEN || github.token }}

      - name: Cache engine cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .engine-src/target
          key: cargo-server-${{ runner.os }}-v${{ steps.ver.outputs.df_version }}-${{ hashFiles('.engine-src/Cargo.lock') }}
          restore-keys: |
            cargo-server-${{ runner.os }}-

      - name: Build delta-forge-server
        run: |
          set -euxo pipefail
          cd .engine-src
          cargo build --release \
              -p delta-forge-control \
              --bin delta-forge-server \
              --features "api,cloud-all"
          mkdir -p ../build/df-bins
          cp target/release/delta-forge-server ../build/df-bins/
          DF_GIT_SHA=$(git rev-parse HEAD)
          echo "DF_GIT_SHA=${DF_GIT_SHA}" >> $GITHUB_ENV
          echo "Built delta-forge-server at engine commit ${DF_GIT_SHA}"

      # ---------- 4. Build + push image --------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push bench image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.bench_tag }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.bench_tag }}
            org.opencontainers.image.licenses=Apache-2.0
            com.deltaforge.engine.repo=https://github.com/${{ env.ENGINE_REPO }}
            com.deltaforge.engine.revision=${{ env.DF_GIT_SHA }}
            com.deltaforge.engine.version=${{ steps.ver.outputs.df_version }}
          build-args: |
            DF_VERSION=${{ steps.ver.outputs.df_version }}
            DF_GIT_SHA=${{ env.DF_GIT_SHA }}
            DF_GPG_FINGERPRINT=${{ secrets.DELTAFORGE_GPG_FINGERPRINT }}
            DF_GPG_PUBKEY_PATH=${{ env.GPG_PUBKEY_PATH }}
            PYSPARK_VERSION=4.0.0
            DELTA_SPARK_VERSION=4.0.0
            JDK_VERSION=17
            POSTGRES_MAJOR=15
          provenance: true
          sbom: true

      # ---------- 5. Smoke test ----------------------------------------------
      - name: Smoke-test the published image
        run: |
          set -euxo pipefail
          docker pull ${IMAGE_NAME}:${{ steps.ver.outputs.bench_tag }}
          docker run --rm -d --name bench-smoke \
              -e DELTA_FORGE_ADMIN_PASSWORD=ci_smoke \
              -e DELTA_FORGE_ENGINEER_PASSWORD=ci_smoke \
              ${IMAGE_NAME}:${{ steps.ver.outputs.bench_tag }} \
              sleep 90
          for i in $(seq 1 120); do
            if docker logs bench-smoke 2>&1 | grep -q "bootstrap complete"; then
              echo "smoke ok"
              docker rm -f bench-smoke || true
              exit 0
            fi
            sleep 1
          done
          echo "smoke timeout"
          docker logs bench-smoke || true
          docker rm -f bench-smoke || true
          exit 1
